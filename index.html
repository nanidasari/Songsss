<!doctype html>
<html lang="te"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dhaivakrupa Ujjeevakeerthanalu</title>
<meta name="description" content="Telugu Christian songs and lyrics">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@500;700&family=Noto+Sans+Telugu:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17305C;--accent:#B8892B;--bg:#F4F7FC;--surface:#fff;--text:#1B2433;--muted:#5F6B80;--line:#DCE3EF;--glow:#FFF3D1;--fs:1.15rem;
--serif:"Noto Serif Telugu",Georgia,serif;--sans:"Noto Sans Telugu",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D1526;--surface:#14203A;--text:#E8EDF7;--muted:#9AA8C2;--line:#25355A;--glow:#3A3010;--ink:#9DB8EE}}
:root[data-theme=dark]{--bg:#0D1526;--surface:#14203A;--text:#E8EDF7;--muted:#9AA8C2;--line:#25355A;--glow:#3A3010;--ink:#9DB8EE}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.7 var(--sans);padding-top:env(safe-area-inset-top)}
a{color:inherit}button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:700 1.05rem/1.2 var(--serif);color:var(--ink)}
.brand img{height:36px;width:36px;object-fit:contain;border-radius:8px}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 14px;font-size:.9rem}
.hero{position:relative;text-align:center;padding:56px 0 44px;overflow:hidden}
.hero::before{content:"";position:absolute;left:50%;top:-40%;width:900px;height:900px;transform:translateX(-50%);
 background:radial-gradient(circle,var(--glow) 0%,transparent 62%);z-index:-1;animation:dawn 1.6s ease-out both}
@keyframes dawn{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.hero h1{font:700 clamp(2rem,7vw,3.4rem)/1.35 var(--serif);color:var(--ink);margin:0}
.hero .en{margin:.4rem 0 0;color:var(--muted);letter-spacing:.04em}
.verse{max-width:560px;margin:28px auto 0;font:500 1.15rem/1.9 var(--serif)}
.verse small{display:block;margin-top:6px;color:var(--accent);font:600 .95rem var(--sans)}
.tools{position:sticky;top:0;background:var(--bg);padding:12px 0;z-index:5;border-bottom:1px solid var(--line)}
.search{width:100%;padding:13px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;color:var(--text);border-radius:999px;padding:5px 15px;font-size:.92rem}
.chip[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#0D1526}
.list{list-style:none;margin:8px 0 0;padding:0}
.list a{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 4px;border-bottom:1px solid var(--line);text-decoration:none}
.list a:hover .t{color:var(--accent)}
.t{font:600 1.15rem/1.5 var(--serif)}
.sub{color:var(--muted);font-size:.88rem}
.tag{flex:none;font-size:.82rem;color:var(--ink);background:color-mix(in srgb,var(--accent) 16%,transparent);padding:2px 12px;border-radius:999px}
.star{color:var(--accent)}
.empty{padding:48px 0;text-align:center;color:var(--muted)}
.back{display:inline-block;margin:18px 0;color:var(--muted);text-decoration:none}
.song h2{font:700 clamp(1.7rem,5vw,2.4rem)/1.4 var(--serif);color:var(--ink);margin:0}
.meta{color:var(--muted);margin:.3rem 0 1.2rem}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 22px}
.lyrics{font:500 var(--fs)/2.05 var(--serif);white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:26px 24px;max-width:640px}
.photo{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:18px;display:block}
audio{width:100%;margin-top:18px}
.media a{color:var(--accent);font-weight:600}
footer{margin-top:64px;padding:32px 0 40px;border-top:1px solid var(--line);color:var(--muted);text-align:center}
footer .links{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:12px}
footer a{color:var(--ink)}.about{max-width:520px;margin:0 auto 16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.hero::before{animation:none}html{scroll-behavior:auto}}
</style></head>
<body>
<div class="wrap">
 <header class="top">
  <a class="brand" href="#/" id="brand"><span id="brandName">Dhaivakrupa</span></a>
  <button class="icon-btn" id="theme" aria-label="Switch light or dark mode">🌓 Theme</button>
 </header>
 <main id="app" aria-live="polite"></main>
 <footer id="foot"></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let D={settings:{},songs:[]}, state={q:'',cat:'అన్నీ'}, fs=+localStorage.getItem('fs')||1.15;
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
const norm=s=>String(s||'').toLowerCase();

async function init(){
  try{D=await (await fetch('/data.json',{cache:'no-cache'})).json()}catch(e){app.innerHTML='<p class="empty">Songs could not be loaded. Please refresh.</p>'}
  const s=D.settings, r=document.documentElement.style;
  if(s.accent)r.setProperty('--accent',s.accent); if(s.ink)r.setProperty('--ink',s.ink);
  document.title=s.site_name||document.title;
  if(s.seo_description)document.querySelector('meta[name=description]').content=s.seo_description;
  if(s.favicon){const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${s.favicon}</text></svg>`);document.head.appendChild(l)}
  $('#brand').innerHTML=(s.logo?`<img src="${esc(s.logo)}" alt="">`:'')+`<span>${esc(s.site_name_te||s.site_name)}</span>`;
  const links=[s.youtube&&`<a href="${esc(s.youtube)}" target="_blank" rel="noopener">YouTube</a>`,s.facebook&&`<a href="${esc(s.facebook)}" target="_blank" rel="noopener">Facebook</a>`,s.whatsapp&&`<a href="https://wa.me/${esc(s.whatsapp)}" target="_blank" rel="noopener">WhatsApp</a>`,s.email&&`<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`].filter(Boolean).join('');
  $('#foot').innerHTML=(s.about?`<p class="about">${esc(s.about)}</p>`:'')+(links?`<div class="links">${links}</div>`:'')+`<div>${esc(s.footer||'')}</div><div class="sub">© ${new Date().getFullYear()} ${esc(s.site_name||'')}</div>`;
  route();
}
function home(){
  const s=D.settings, cats=['అన్నీ',...new Set(D.songs.map(x=>x.category).filter(Boolean))];
  app.innerHTML=`<section class="hero"><h1>${esc(s.site_name_te||s.site_name)}</h1><p class="en">${esc(s.site_name||'')}</p>
   ${s.verse?`<p class="verse">${esc(s.verse)}<small>${esc(s.verse_ref||'')}</small></p>`:''}</section>
   <div class="tools"><input class="search" id="q" type="search" placeholder="పాట పేరు లేదా పదం వెతకండి…" aria-label="Search songs" value="${esc(state.q)}">
   <div class="chips" role="group" aria-label="Categories">${cats.map(c=>`<button class="chip" aria-pressed="${c===state.cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
   <ul class="list" id="list"></ul>`;
  $('#q').oninput=e=>{state.q=e.target.value;draw()};
  app.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{state.cat=b.dataset.c;home()});
  draw();
}
function draw(){
  const q=norm(state.q), res=D.songs.filter(x=>(state.cat==='అన్నీ'||x.category===state.cat)&&(!q||norm([x.title,x.title_en,x.lyrics,x.writer].join(' ')).includes(q)));
  res.sort((a,b)=>(b.featured?1:0)-(a.featured?1:0));
  $('#list').innerHTML=res.length?res.map(x=>`<li><a href="#/song/${encodeURIComponent(x.id)}"><div><div class="t">${x.featured?'<span class="star" aria-label="Featured">★</span> ':''}${esc(x.title)}</div><div class="sub">${esc([x.title_en,x.writer].filter(Boolean).join(' • '))}</div></div><span class="tag">${esc(x.category||'')}</span></a></li>`).join(''):'<li class="empty">ఈ వెతుకులాటకు పాటలు దొరకలేదు. వేరే పదంతో ప్రయత్నించండి.</li>';
}
function song(id){
  const x=D.songs.find(s=>s.id===id), s=D.settings;
  if(!x){app.innerHTML='<p class="empty">పాట దొరకలేదు.</p><p class="empty"><a href="#/">అన్ని పాటలు చూడండి</a></p>';return}
  document.title=x.title+' – '+(s.site_name||'');
  const yt=x.youtube?`<p class="media"><a href="${esc(x.youtube)}" target="_blank" rel="noopener">YouTube లో వినండి</a></p>`:'';
  app.innerHTML=`<a class="back" href="#/">‹ అన్ని పాటలు</a><article class="song"><h2>${esc(x.title)}</h2>
  <p class="meta">${esc([x.title_en,x.category,x.writer&&'రచన: '+x.writer,x.scale&&'స్కేల్: '+x.scale].filter(Boolean).join(' • '))}</p>
  <div class="bar"><button class="icon-btn" id="sm" aria-label="Smaller text">A−</button><button class="icon-btn" id="lg" aria-label="Larger text">A+</button><button class="icon-btn" id="cp">కాపీ</button><button class="icon-btn" id="sh">షేర్</button></div>
  ${x.lyrics?`<div class="lyrics">${esc(x.lyrics)}</div>`:''}
  ${x.lyrics_image?`<img class="photo" src="${esc(x.lyrics_image)}" alt="${esc(x.title)} – పాట చిత్రం">`:''}
  ${x.audio?`<audio controls src="${esc(x.audio)}"></audio>`:''}${yt}</article>`;
  const set=v=>{fs=Math.min(2,Math.max(.9,v));localStorage.setItem('fs',fs);document.documentElement.style.setProperty('--fs',fs+'rem')};set(fs);
  $('#sm').onclick=()=>set(fs-.1);$('#lg').onclick=()=>set(fs+.1);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(x.title+'\n\n'+(x.lyrics||'')+'\n\n'+location.href);toast('కాపీ అయింది')}catch{toast('కాపీ కాలేదు')}};
  $('#sh').onclick=()=>navigator.share?navigator.share({title:x.title,url:location.href}).catch(()=>{}):$('#cp').click();
}
function route(){
  const m=location.hash.match(/^#\/song\/(.+)$/);
  window.scrollTo(0,0);
  if(m)song(decodeURIComponent(m[1])); else {document.title=D.settings.site_name||document.title;home()}
}
addEventListener('hashchange',route);
$('#theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0D1526';d.dataset.theme=dark?'light':'dark'};
init();
</script></body></html>
