<!doctype html>
<html lang="te"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dhaivakrupa Ujjeevakeerthanalu</title>
<meta name="description" content="Telugu Christian songs and Bible">
<meta name="theme-color" content="#17305C"><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Telugu:wght@500;700&family=Noto+Sans+Telugu:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#17305C;--accent:#B8892B;--bg:#F4F7FC;--surface:#fff;--text:#1B2433;--muted:#5F6B80;--line:#DCE3EF;--glow:#FFF3D1;--fs:1.15rem;--nav:64px;
--serif:"Noto Serif Telugu",Georgia,serif;--sans:"Noto Sans Telugu",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0D1526;--surface:#14203A;--text:#E8EDF7;--muted:#9AA8C2;--line:#25355A;--glow:#3A3010;--ink:#9DB8EE}}
:root[data-theme=dark]{--bg:#0D1526;--surface:#14203A;--text:#E8EDF7;--muted:#9AA8C2;--line:#25355A;--glow:#3A3010;--ink:#9DB8EE}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.7 var(--sans)}
a{color:inherit}button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:720px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 24px)}
.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--ink);color:#fff}
:root[data-theme=dark] .bar,:root:not([data-theme=light]) .bar{--x:0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .bar{background:#0A1020;color:var(--text)}}
:root[data-theme=dark] .bar{background:#0A1020;color:var(--text)}
.bar h1{flex:1;margin:0;font:700 1.05rem/1.3 var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar img{height:30px;width:30px;border-radius:8px;object-fit:contain}
.ib{border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:999px;min-width:40px;height:40px;padding:0 14px}
.pad{padding:0 16px}
.banner{position:relative;overflow:hidden;text-align:center;padding:30px 16px 22px}
.banner::before{content:"";position:absolute;left:50%;top:-60%;width:700px;height:700px;transform:translateX(-50%);background:radial-gradient(circle,var(--glow),transparent 62%);z-index:-1;animation:dawn 1.4s ease-out both}
@keyframes dawn{from{opacity:0;transform:translateX(-50%) scale(.6)}to{opacity:1;transform:translateX(-50%) scale(1)}}
.banner .verse{margin:0 auto;max-width:520px;font:500 1.08rem/1.9 var(--serif)}
.banner small{display:block;color:var(--accent);font:600 .9rem var(--sans);margin-top:4px}
.tools{position:sticky;top:calc(56px + env(safe-area-inset-top));z-index:10;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.search{width:100%;padding:12px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit}
.row{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:transparent;border-radius:999px;padding:4px 14px;font-size:.9rem;min-height:34px}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
:root[data-theme=dark] .chip[aria-pressed=true],:root[data-theme=dark] .seg button[aria-pressed=true]{color:#0D1526}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chip[aria-pressed=true],:root:not([data-theme=light]) .seg button[aria-pressed=true]{color:#0D1526}}
.letters{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0 0}
.letters a{min-width:34px;height:34px;display:grid;place-items:center;border-radius:8px;text-decoration:none;font:600 1rem var(--serif);color:var(--ink);background:var(--surface);border:1px solid var(--line)}
.gh{margin:0;padding:18px 16px 6px;font:700 1.4rem var(--serif);color:var(--accent);scroll-margin-top:170px}
.list{list-style:none;margin:0;padding:0 16px}
.list a{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 2px;border-bottom:1px solid var(--line);text-decoration:none}
.list a:active{background:var(--surface)}
.t{font:600 1.1rem/1.5 var(--serif)}.sub{color:var(--muted);font-size:.86rem}
.tag{flex:none;font-size:.78rem;color:var(--ink);background:color-mix(in srgb,var(--accent) 16%,transparent);padding:2px 10px;border-radius:999px}
.star{color:var(--accent)}.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.view{padding:6px 16px}
.view h2{font:700 clamp(1.6rem,5vw,2.2rem)/1.4 var(--serif);color:var(--ink);margin:.4rem 0 0}
.meta{color:var(--muted);margin:.2rem 0 1rem}
.tb{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}
.tb button,.seg button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;min-height:38px}
.lyrics{font:500 var(--fs)/2.05 var(--serif);white-space:pre-wrap;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:22px 20px}
.photo{max-width:100%;border-radius:8px;border:1px solid var(--line);margin-top:16px}
audio{width:100%;margin-top:16px}.view .media a{color:var(--accent);font-weight:600}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:14px 0}
.bk{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-decoration:none;display:block}
.bk b{display:block;font:600 1rem/1.4 var(--serif)}.bk span{color:var(--muted);font-size:.82rem}
.chs{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:8px;padding:14px 0}
.chs a{height:48px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:10px;text-decoration:none;font-weight:600}
.v{display:block;padding:8px 10px;border-radius:8px;cursor:pointer}
.v.sel{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.v sup{color:var(--accent);font:600 .72rem var(--sans);margin-right:5px}
.v .te{font:500 var(--fs)/2 var(--serif)}.v .en{font:400 calc(var(--fs) - .12rem)/1.7 var(--sans);color:var(--muted);display:block}
.v .en.only{color:var(--text)}
.pn{display:flex;gap:10px;justify-content:space-between;padding:18px 0}
.pn a{flex:1;text-align:center;padding:12px;border:1px solid var(--line);background:var(--surface);border-radius:12px;text-decoration:none;font-weight:600}
.pn a.off{opacity:.35;pointer-events:none}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav div{max-width:720px;margin:0 auto;display:flex}
.nav a{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:500}
.nav a[aria-current=page]{color:var(--accent);font-weight:600}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.about{padding:20px 16px;text-align:center;color:var(--muted)}.about a{color:var(--ink);font-weight:600;display:block;padding:6px}
.toast{position:fixed;bottom:calc(var(--nav) + 24px);left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 18px;border-radius:999px;opacity:0;transition:.25s;pointer-events:none;z-index:40}
.toast.on{opacity:1}

/* projector */
#pj{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;--pb:#000;--pt:#fff;--pa:#F6D98B;background:var(--pb);color:var(--pt);user-select:none}
#pj.on{display:flex}
#pj[data-th=light]{--pb:#fff;--pt:#111827;--pa:#9A6B12}
#pj[data-th=blue]{--pb:#0B1F44;--pt:#F3F6FF;--pa:#F6D98B}
#pj .st{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;padding:4vmin 6vmin 12vmin;overflow:hidden;cursor:pointer}
#pj .in{max-width:100%;transition:opacity .2s}
#pj.blank .in{opacity:0}
#pj .pj-l{font:700 1em/1.55 var(--serif);white-space:pre-line}
#pj .pj-e{font:500 .55em/1.5 var(--sans);opacity:.85;margin-top:.5em;white-space:pre-line}
#pj .pj-ref{font:600 .4em var(--sans);color:var(--pa);margin-bottom:.6em}
#pj .pj-t{font:700 1.3em/1.4 var(--serif)}
#pj .pj-s{font:500 .6em/1.5 var(--sans);color:var(--pa);margin-top:.5em}
#pj img{max-width:100%;max-height:80vh;border-radius:6px}
#pj .ct{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6));transition:opacity .3s;font-size:.9rem}
#pj.idle .ct{opacity:0;pointer-events:none}#pj.idle .st{cursor:none}
#pj .ct button{border:1px solid rgba(255,255,255,.35);background:rgba(20,20,20,.75);color:#fff;border-radius:999px;min-width:44px;height:44px;padding:0 14px}
#pj .cnt{color:#fff;min-width:64px;text-align:center;font-weight:600}
#pj .bar2{position:absolute;left:0;right:0;top:0;height:5px}#pj .bar2 i{display:block;height:100%;background:var(--pa);width:0;transition:width .25s}
@media (prefers-reduced-motion:reduce){.banner::before{animation:none}}
</style></head>
<body>
<div class="app">
 <header class="bar"><span id="logo"></span><h1 id="title">Dhaivakrupa</h1><button class="ib" id="theme" aria-label="Switch light or dark mode">🌓</button></header>
 <main id="main" aria-live="polite"></main>
</div>
<nav class="nav" aria-label="Main"><div>
 <a href="#/" data-t="songs"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>పాటలు</a>
 <a href="#/bible" data-t="bible"><svg viewBox="0 0 24 24"><path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v18H6.5A2.5 2.5 0 0 0 4 22.5z"/><path d="M12 6v8M8.5 9h7"/></svg>బైబిల్</a>
 <a href="#/about" data-t="about"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>గురించి</a>
</div></nav>
<div id="pj" role="dialog" aria-modal="true" aria-label="Projector presentation" data-th="dark">
 <div class="bar2"><i id="pjbar"></i></div>
 <div class="st" id="pjst"><div class="in" id="pjc"></div></div>
 <div class="ct" id="pjct">
  <button id="pjp" aria-label="Previous slide">‹</button><span class="cnt" id="pjn"></span><button id="pjnx" aria-label="Next slide">›</button>
  <button id="pjm" aria-label="Smaller text">A−</button><button id="pjl" aria-label="Larger text">A+</button>
  <button id="pjt" aria-label="Change colours">🎨</button><button id="pjb" aria-label="Blank screen">⬛</button>
  <button id="pjf" aria-label="Full screen">⛶</button><button id="pjx" aria-label="Close presentation">✕ మూసివేయి</button>
 </div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), M=$('#main');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
let D={settings:{},songs:[]}, st={q:'',cat:'అన్నీ'}, fs=LS.get('fs',1.15), blang=LS.get('blang','te'), books=[], cache={};
const col=new Intl.Collator('te'), isTe=c=>/[\u0C00-\u0C7F]/.test(c);
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),1800)};
const setFs=v=>{fs=Math.min(2,Math.max(.9,v));LS.set('fs',fs);document.documentElement.style.setProperty('--fs',fs+'rem')};
const norm=s=>String(s||'').toLowerCase();
const title=(t,back)=>{$('#title').textContent=t};

async function init(){
  setFs(fs);
  try{D=await (await fetch('/data.json',{cache:'no-cache'})).json()}catch(e){}
  D.songs.sort((a,b)=>col.compare(a.title,b.title));
  const s=D.settings, r=document.documentElement.style;
  if(s.accent)r.setProperty('--accent',s.accent); if(s.ink)r.setProperty('--ink',s.ink);
  document.title=s.site_name||document.title;
  if(s.seo_description)document.querySelector('meta[name=description]').content=s.seo_description;
  if(s.logo)$('#logo').innerHTML=`<img src="${esc(s.logo)}" alt="">`;
  if(s.favicon){const l=document.createElement('link');l.rel='icon';l.href='data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><text y=".9em" font-size="90">${s.favicon}</text></svg>`);document.head.appendChild(l)}
  try{books=await (await fetch('/bible/books.json')).json()}catch(e){}
  if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
  route();
}
function nav(t){document.querySelectorAll('.nav a').forEach(a=>{if(a.dataset.t===t)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')})}

/* ---------- Songs ---------- */
function group(t){const c=[...String(t).trim().replace(/^[^\p{L}\p{N}]+/u,'')][0]||'#';return c.toUpperCase()}
function songsHome(){
  nav('songs');title(D.settings.site_name_te||D.settings.site_name);
  const s=D.settings, cats=['అన్నీ',...new Set(D.songs.map(x=>x.category).filter(Boolean))];
  M.innerHTML=`<section class="banner">${s.verse?`<p class="verse">${esc(s.verse)}<small>${esc(s.verse_ref||'')}</small></p>`:`<p class="verse">${esc(s.tagline||'')}</p>`}</section>
  <div class="tools"><input class="search" id="q" type="search" placeholder="పాట పేరు లేదా పదం వెతకండి…" aria-label="Search songs" value="${esc(st.q)}">
  <div class="row" role="group" aria-label="Categories">${cats.map(c=>`<button class="chip" aria-pressed="${c===st.cat}" data-c="${esc(c)}">${esc(c)}</button>`).join('')}</div></div>
  <div class="pad"><div class="letters" id="letters" aria-label="అక్షర సూచిక"></div></div><div id="list"></div>`;
  $('#q').oninput=e=>{st.q=e.target.value;drawSongs()};
  M.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{st.cat=b.dataset.c;songsHome()});
  drawSongs();
}
function drawSongs(){
  const q=norm(st.q), res=D.songs.filter(x=>(st.cat==='అన్నీ'||x.category===st.cat)&&(!q||norm([x.title,x.title_en,x.lyrics,x.writer].join(' ')).includes(q)));
  if(!res.length){$('#list').innerHTML='<p class="empty">పాటలు దొరకలేదు. వేరే పదంతో ప్రయత్నించండి.</p>';$('#letters').innerHTML='';return}
  const g=new Map();res.forEach(x=>{const k=group(x.title);(g.get(k)||g.set(k,[]).get(k)).push(x)});
  const keys=[...g.keys()].sort((a,b)=>(isTe(b)-isTe(a))||col.compare(a,b));
  $('#letters').innerHTML=keys.map((k,i)=>`<a href="#/" data-g="${i}">${esc(k)}</a>`).join('');
  $('#letters').onclick=e=>{const a=e.target.closest('a');if(!a)return;e.preventDefault();document.getElementById('g'+a.dataset.g)?.scrollIntoView({behavior:'smooth'})};
  $('#list').innerHTML=keys.map((k,i)=>`<h3 class="gh" id="g${i}">${esc(k)}</h3><ul class="list">${g.get(k).map(x=>`<li><a href="#/song/${encodeURIComponent(x.id)}"><div><div class="t">${x.featured?'<span class="star" aria-label="Featured">★</span> ':''}${esc(x.title)}</div><div class="sub">${esc([x.title_en,x.writer].filter(Boolean).join(' • '))}</div></div><span class="tag">${esc(x.category||'')}</span></a></li>`).join('')}</ul>`).join('');
}
function songView(id){
  nav('songs');const x=D.songs.find(s=>s.id===id);
  if(!x){M.innerHTML='<p class="empty">పాట దొరకలేదు.</p><p class="empty"><a href="#/">అన్ని పాటలు</a></p>';return}
  title(x.title);document.title=x.title+' – '+(D.settings.site_name||'');
  const i=D.songs.indexOf(x),p=D.songs[i-1],n=D.songs[i+1];
  M.innerHTML=`<article class="view"><h2>${esc(x.title)}</h2>
  <p class="meta">${esc([x.title_en,x.category,x.writer&&'రచన: '+x.writer,x.scale&&'స్కేల్: '+x.scale].filter(Boolean).join(' • '))}</p>
  <div class="tb"><button id="sm" aria-label="Smaller text">A−</button><button id="lg" aria-label="Larger text">A+</button><button id="cp">కాపీ</button><button id="sh">షేర్</button><button id="pj1">📽 ప్రొజెక్టర్</button></div>
  ${x.lyrics?`<div class="lyrics">${esc(x.lyrics)}</div>`:''}
  ${x.lyrics_image?`<img class="photo" src="${esc(x.lyrics_image)}" alt="${esc(x.title)} – పాట చిత్రం">`:''}
  ${x.audio?`<audio controls src="${esc(x.audio)}"></audio>`:''}
  ${x.youtube?`<p class="media"><a href="${esc(x.youtube)}" target="_blank" rel="noopener">YouTube లో వినండి</a></p>`:''}
  <div class="pn"><a class="${p?'':'off'}" href="#/song/${p?encodeURIComponent(p.id):''}">‹ ముందు</a><a class="${n?'':'off'}" href="#/song/${n?encodeURIComponent(n.id):''}">తరువాత ›</a></div></article>`;
  $('#pj1').onclick=()=>present(songSlides(x));
  $('#sm').onclick=()=>setFs(fs-.1);$('#lg').onclick=()=>setFs(fs+.1);
  $('#cp').onclick=async()=>{try{await navigator.clipboard.writeText(x.title+'\n\n'+(x.lyrics||'')+'\n\n'+location.href);toast('కాపీ అయింది')}catch{toast('కాపీ కాలేదు')}};
  $('#sh').onclick=()=>navigator.share?navigator.share({title:x.title,url:location.href}).catch(()=>{}):$('#cp').click();
}

/* ---------- Bible ---------- */
const bname=(b,l)=>l==='en'?b.en:b.te;
async function load(l,n){const k=l+n;if(!cache[k])cache[k]=await (await fetch(`/bible/${l}/${n}.json`)).json();return cache[k]}
function langSeg(){return `<div class="seg" role="group" aria-label="Language">${[['te','తెలుగు'],['en','English'],['both','రెండూ']].map(([v,t])=>`<button data-l="${v}" aria-pressed="${blang===v}">${t}</button>`).join('')}</div>`}
function bindSeg(fn){M.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{blang=b.dataset.l;LS.set('blang',blang);fn()})}
let ot=true;
function bibleHome(){
  nav('bible');title('పరిశుద్ధ గ్రంథము');
  if(!books.length){M.innerHTML='<p class="empty">బైబిల్ డేటా లోడ్ కాలేదు. పేజీని రిఫ్రెష్ చేయండి.</p>';return}
  const last=LS.get('last',null);
  const list=books.map((b,i)=>({b,i})).filter(o=>ot?o.i<39:o.i>=39);
  M.innerHTML=`<div class="view">${last?`<div class="pn" style="padding:6px 0 0"><a href="#/bible/${last[0]}/${last[1]}">చదువుతున్నది కొనసాగించండి: ${esc(bname(books[last[0]],blang==='en'?'en':'te'))} ${last[1]}</a></div>`:''}
  <div class="seg" style="margin-top:14px"><button data-t="1" aria-pressed="${ot}">పాత నిబంధన</button><button data-t="0" aria-pressed="${!ot}">క్రొత్త నిబంధన</button></div>
  <div style="margin-top:12px">${langSeg()}</div>
  <div class="books">${list.map(({b,i})=>`<a class="bk" href="#/bible/${i}"><b>${esc(blang==='en'?b.en:b.te)}</b><span>${esc(blang==='both'?b.en+' • ':'')}${b.ch} అధ్యాయాలు</span></a>`).join('')}</div></div>`;
  M.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ot=b.dataset.t==='1';bibleHome()});
  bindSeg(bibleHome);
}
function chapters(b){
  nav('bible');const bk=books[b];if(!bk)return bibleHome();title(blang==='en'?bk.en:bk.te);
  M.innerHTML=`<div class="view"><a href="#/bible" style="color:var(--muted);text-decoration:none">‹ గ్రంథములు</a><h2>${esc(bk.te)}</h2><p class="meta">${esc(bk.en)}</p>
  <div class="chs">${Array.from({length:bk.ch},(_,i)=>`<a href="#/bible/${b}/${i+1}">${i+1}</a>`).join('')}</div></div>`;
}
async function read(b,c){
  nav('bible');const bk=books[b];if(!bk||c<1||c>bk.ch)return bibleHome();
  title(`${blang==='en'?bk.en:bk.te} ${c}`);LS.set('last',[b,c]);
  M.innerHTML='<p class="empty">లోడ్ అవుతోంది…</p>';
  let te=[],en=[];
  try{if(blang!=='en')te=(await load('te',b+1))[c-1]||[];if(blang!=='te')en=(await load('en',b+1))[c-1]||[]}catch(e){M.innerHTML='<p class="empty">ఈ అధ్యాయం లోడ్ కాలేదు. ఇంటర్నెట్ చూసుకుని మళ్ళీ ప్రయత్నించండి.</p>';return}
  const n=Math.max(te.length,en.length);
  const prev=c>1?`#/bible/${b}/${c-1}`:b>0?`#/bible/${b-1}/${books[b-1].ch}`:'',next=c<bk.ch?`#/bible/${b}/${c+1}`:b<books.length-1?`#/bible/${b+1}/1`:'';
  M.innerHTML=`<div class="view"><a href="#/bible/${b}" style="color:var(--muted);text-decoration:none">‹ ${esc(blang==='en'?bk.en:bk.te)} అధ్యాయాలు</a>
  <h2>${esc(blang==='en'?bk.en:bk.te)} ${c}</h2>${blang==='both'?`<p class="meta">${esc(bk.en)} ${c}</p>`:''}
  <div class="tb" style="margin-top:12px">${langSeg()}<button id="sm" aria-label="Smaller text">A−</button><button id="lg" aria-label="Larger text">A+</button><button id="cp">కాపీ</button><button id="pj1">📽 ప్రొజెక్టర్</button></div>
  <div id="vs">${Array.from({length:n},(_,i)=>`<span class="v" data-i="${i}"><sup>${i+1}</sup>${te[i]?`<span class="te">${esc(te[i])}</span>`:''}${en[i]?`<span class="en${te[i]?'':' only'}">${esc(en[i])}</span>`:''}</span>`).join('')}</div>
  <div class="pn"><a class="${prev?'':'off'}" href="${prev||'#'}">‹ ముందు</a><a class="${next?'':'off'}" href="${next||'#'}">తరువాత ›</a></div></div>`;
  window.scrollTo(0,0);
  $('#vs').onclick=e=>{const v=e.target.closest('.v');if(v)v.classList.toggle('sel')};
  $('#sm').onclick=()=>setFs(fs-.1);$('#lg').onclick=()=>setFs(fs+.1);
  $('#cp').onclick=async()=>{
    const sel=[...document.querySelectorAll('.v.sel')],vs=sel.length?sel:[...document.querySelectorAll('.v')];
    const txt=vs.map(v=>{const i=+v.dataset.i;return `${i+1}. ${[te[i],en[i]].filter(Boolean).join('\n   ')}`}).join('\n');
    const ref=`${blang==='en'?bk.en:bk.te} ${c}${sel.length&&sel.length<4?':'+sel.map(v=>+v.dataset.i+1).join(','):''}`;
    try{await navigator.clipboard.writeText(ref+'\n'+txt);toast(sel.length?'ఎంచుకున్న వచనాలు కాపీ అయ్యాయి':'అధ్యాయం కాపీ అయింది')}catch{toast('కాపీ కాలేదు')}};
  $('#pj1').onclick=()=>{
    const ref=`${blang==='en'?bk.en:bk.te} ${c}`,sel=[...document.querySelectorAll('.v.sel')].map(v=>+v.dataset.i);
    const idx=sel.length?sel:Array.from({length:n},(_,i)=>i);
    present(idx.map(i=>({h:`<div class="pj-ref">${esc(ref)}:${i+1}</div>${te[i]?`<div class="pj-l">${esc(te[i])}</div>`:''}${en[i]?`<div class="${te[i]?'pj-e':'pj-l'}">${esc(en[i])}</div>`:''}`})));
  };
  bindSeg(()=>read(b,c));
}

/* ---------- Projector ---------- */
const PJ={slides:[],i:0,scale:LS.get('pjs',1),th:LS.get('pjt','dark'),idle:null,lock:null};
function chunk(text){return text.split(/\n\s*\n/).map(t=>t.trim()).filter(Boolean).flatMap(t=>{const L=t.split('\n');if(L.length<=6)return[t];const o=[];for(let i=0;i<L.length;i+=4)o.push(L.slice(i,i+4).join('\n'));return o})}
function songSlides(x){
  const sl=[{h:`<div class="pj-t">${esc(x.title)}</div><div class="pj-s">${esc([x.title_en,x.writer].filter(Boolean).join(' • '))}</div>`}];
  chunk(x.lyrics||'').forEach(t=>sl.push({h:`<div class="pj-l">${esc(t)}</div>`}));
  if(!x.lyrics&&x.lyrics_image)sl.push({h:`<img src="${esc(x.lyrics_image)}" alt="">`,img:1});
  return sl;
}
function pjFit(){
  const st=$('#pjst'),c=$('#pjc');let sz=PJ.scale*Math.min(innerWidth,innerHeight)*.085;
  const has=c.querySelector('img');c.style.fontSize=sz+'px';if(has)return;
  const cap=st.clientHeight-st.clientHeight*.0;let n=0;
  while((c.scrollHeight>st.clientHeight-parseFloat(getComputedStyle(st).paddingTop)-parseFloat(getComputedStyle(st).paddingBottom)||c.scrollWidth>st.clientWidth)&&sz>14&&n++<40){sz*=.93;c.style.fontSize=sz+'px'}
}
function pjShow(i){
  PJ.i=Math.max(0,Math.min(PJ.slides.length-1,i));
  $('#pjc').innerHTML=PJ.slides[PJ.i].h;pjFit();
  $('#pjn').textContent=`${PJ.i+1} / ${PJ.slides.length}`;
  $('#pjbar').style.width=((PJ.i+1)/PJ.slides.length*100)+'%';
}
function pjWake(){const k=()=>{clearTimeout(PJ.idle);$('#pj').classList.remove('idle');PJ.idle=setTimeout(()=>$('#pj').classList.add('idle'),3000)};PJ.k=k;k()}
function pjKey(e){
  const K=e.key;if(['ArrowRight','ArrowDown','PageDown',' ','Enter'].includes(K)){e.preventDefault();pjShow(PJ.i+1)}
  else if(['ArrowLeft','ArrowUp','PageUp','Backspace'].includes(K)){e.preventDefault();pjShow(PJ.i-1)}
  else if(K==='Home')pjShow(0);else if(K==='End')pjShow(PJ.slides.length-1);
  else if(K==='Escape')pjClose();else if(K==='b'||K==='B'||K==='.')$('#pj').classList.toggle('blank');
  else if(K==='f'||K==='F')pjFull();else if(K==='+'||K==='=')pjSize(.1);else if(K==='-')pjSize(-.1);
  PJ.k&&PJ.k();
}
function pjSize(d){PJ.scale=Math.min(2,Math.max(.4,PJ.scale+d));LS.set('pjs',PJ.scale);pjShow(PJ.i)}
function pjFull(){const e=document.documentElement;if(document.fullscreenElement)document.exitFullscreen();else e.requestFullscreen?.().catch(()=>toast('Full screen లభ్యం కాదు'))}
function pjClose(){
  $('#pj').classList.remove('on','blank','idle');document.body.style.overflow='';
  removeEventListener('keydown',pjKey);removeEventListener('resize',pjRe);
  if(document.fullscreenElement)document.exitFullscreen();PJ.lock?.release?.();PJ.lock=null;
}
const pjRe=()=>pjShow(PJ.i);
async function present(slides,start=0){
  PJ.slides=slides;const p=$('#pj');p.dataset.th=PJ.th;p.classList.add('on');document.body.style.overflow='hidden';
  addEventListener('keydown',pjKey);addEventListener('resize',pjRe);pjShow(start);pjWake();
  try{PJ.lock=await navigator.wakeLock?.request('screen')}catch{}
}
(()=>{
  const p=$('#pj'),th=['dark','blue','light'];
  p.addEventListener('mousemove',()=>PJ.k&&PJ.k());p.addEventListener('touchstart',()=>PJ.k&&PJ.k(),{passive:true});
  $('#pjst').onclick=e=>{pjShow(PJ.i+(e.clientX<innerWidth*.3?-1:1))};
  let sx=null;$('#pjst').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  $('#pjst').addEventListener('touchend',e=>{if(sx==null)return;const d=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(d)>50){e.preventDefault();pjShow(PJ.i+(d<0?1:-1))}});
  $('#pjp').onclick=()=>pjShow(PJ.i-1);$('#pjnx').onclick=()=>pjShow(PJ.i+1);
  $('#pjm').onclick=()=>pjSize(-.1);$('#pjl').onclick=()=>pjSize(.1);
  $('#pjt').onclick=()=>{PJ.th=th[(th.indexOf(PJ.th)+1)%3];LS.set('pjt',PJ.th);p.dataset.th=PJ.th};
  $('#pjb').onclick=()=>p.classList.toggle('blank');$('#pjf').onclick=pjFull;$('#pjx').onclick=pjClose;
})();

/* ---------- About ---------- */
function about(){
  nav('about');const s=D.settings;title('గురించి');
  const L=[s.youtube&&['YouTube',s.youtube],s.facebook&&['Facebook',s.facebook],s.whatsapp&&['WhatsApp','https://wa.me/'+s.whatsapp],s.email&&[s.email,'mailto:'+s.email]].filter(Boolean);
  M.innerHTML=`<section class="banner"><p class="verse" style="font-weight:700;font-size:1.5rem">${esc(s.site_name_te||'')}</p><p class="sub">${esc(s.site_name||'')}</p></section>
  <div class="about">${s.about?`<p>${esc(s.about)}</p>`:''}${L.map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join('')}<p>${esc(s.footer||'')}</p>
  <p class="sub">పాటలు: ${D.songs.length} • © ${new Date().getFullYear()}</p></div>`;
}

function route(){
  const h=location.hash||'#/',p=h.split('/').slice(1).map(decodeURIComponent);
  window.scrollTo(0,0);document.title=D.settings.site_name||document.title;
  if(p[0]==='song')songView(p[1]);
  else if(p[0]==='bible'){p[2]?read(+p[1],+p[2]):p[1]!==undefined?chapters(+p[1]):bibleHome()}
  else if(p[0]==='about')about();
  else songsHome();
}
addEventListener('hashchange',route);
$('#theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg').trim()==='#0D1526';d.dataset.theme=dark?'light':'dark'};
init();
</script></body></html>
